# secrets-sbom-checks.yml  ->  goes to  .github/workflows/secrets-sbom-checks.yml
# ADD-ON FILE: sits beside sast-sca-checks.yml in each repo. Does not touch it.
#
# Adds two capabilities:
#   SECRETS - finds passwords/API keys/tokens committed into code or history
#   SBOM    - the complete "ingredient list" of the repo (inventory, not findings)
#
# Uses the SAME two variables the existing file uses (nothing new to create):
#   REPORT_ONLY        = true  -> secrets findings reported, never block
#   SEND_TO_DEFECTDOJO = true  -> file results into the dashboard
# And the same two secrets: DEFECTDOJO_URL, DEFECTDOJO_API_KEY
#
# NOTE: product_type_name below must match the folder (product type) name
# used in the customer's DefectDojo. Change "SaaS Security" if theirs differs.

name: Security Checks 2 (Secrets + SBOM)

on:
  pull_request:                 # every proposed code change
  schedule:
    - cron: "30 2 * * *"        # daily full sweep, offset from the SAST/SCA run
  workflow_dispatch:            # "Run workflow" button for manual testing

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # SECRETS - credentials leaked into code are the most common real
  # breach cause. Scans the full git history, not just current files.
  # ------------------------------------------------------------------
  secrets:
    name: Secrets (leaked keys check)
    runs-on: ubuntu-latest
    continue-on-error: ${{ vars.REPORT_ONLY == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history - old leaks matter too

      - name: Run Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo \
            --report-format json --report-path /repo/gitleaks-report.json \
            --exit-code 1 || SCAN_FAILED=1
          # Normalize: ensure a report file always exists for upload/import
          [ -f gitleaks-report.json ] || echo "[]" > gitleaks-report.json
          exit ${SCAN_FAILED:-0}

      - name: Keep the report (downloadable for 90 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report-${{ github.run_id }}
          path: gitleaks-report.json

      - name: Send to DefectDojo
        if: always() && vars.SEND_TO_DEFECTDOJO == 'true'
        run: |
          curl -s -w "\nHTTP_STATUS:%{http_code}\n" -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
            -F "scan_type=Gitleaks Scan" -F "file=@gitleaks-report.json" \
            -F "product_name=${{ github.repository }}" \
            -F "product_type_name=Development" \
            -F "engagement_name=Secrets" \
            -F "auto_create_context=true" \
            -F "close_old_findings=true" || true

  # ------------------------------------------------------------------
  # SBOM - inventory of every package the repo uses. Fills the
  # Components section of the dashboard. Never blocks anything.
  # ------------------------------------------------------------------
  sbom:
    name: SBOM (ingredient list)
    runs-on: ubuntu-latest
    continue-on-error: true     # inventory must never block a PR
    steps:
      - uses: actions/checkout@v4

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Generate SBOM (CycloneDX format)
        run: |
          syft dir:. -o cyclonedx-json=sbom.cdx.json

      - name: Keep the SBOM (downloadable for 90 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.run_id }}
          path: sbom.cdx.json

      - name: Send to DefectDojo
        if: always() && vars.SEND_TO_DEFECTDOJO == 'true'
        run: |
          curl -s -w "\nHTTP_STATUS:%{http_code}\n" -X POST "${{ secrets.DEFECTDOJO_URL }}/api/v2/import-scan/" \
            -H "Authorization: Token ${{ secrets.DEFECTDOJO_API_KEY }}" \
            -F "scan_type=CycloneDX Scan" -F "file=@sbom.cdx.json" \
            -F "product_name=${{ github.repository }}" \
            -F "product_type_name=Development" \
            -F "engagement_name=SBOM" \
            -F "auto_create_context=true" \
            -F "close_old_findings=true" || true
